<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pump — discovery call script</title>
<style>
  :root{
    --ink:#152021;
    --ink-soft:#4b5a5b;
    --paper:#f6f4ee;
    --card:#ffffff;
    --line:#dcd8cc;
    --accent:#0f6e56;
    --accent-soft:#e1f5ee;
    --accent-deep:#085041;
    --amber:#854f0b;
    --amber-soft:#faeeda;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    padding:32px 20px 140px;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;}
  @media (min-width:1180px){
    .wrap{margin-left:calc(50% - 380px - 170px);}
  }

  .obj-col{
    width:280px;
  }
  @media (min-width:1180px){
    .obj-col{
      position:fixed;
      top:32px;
      right:24px;
      width:280px;
      max-height:calc(100vh - 64px);
      overflow-y:auto;
    }
  }
  @media (max-width:1179px){
    .obj-col{
      max-width:760px;
      margin:32px auto 0;
    }
  }
  .obj-heading{
    font-size:19px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:12px;
  }
  .obj-search{
    width:100%;
    box-sizing:border-box;
    background:var(--accent-soft);
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:13.5px;
    color:var(--ink);
    margin-bottom:12px;
    font-family:inherit;
  }
  .obj-search:focus{outline:none;border-color:var(--accent);}
  .obj-search::placeholder{color:var(--ink-soft);}
  @media (min-width:1180px){
    .obj-search{
      position:sticky;
      top:0;
      z-index:2;
    }
  }
  .obj-empty{
    font-size:13px;
    color:var(--ink-soft);
    padding:10px 4px;
    font-style:italic;
  }
  .obj-tabs{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .obj-item{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .obj-tab{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:12px 14px;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .obj-tab:hover{background:var(--accent-soft);}
  .obj-tab.active{color:var(--accent-deep);}
  .obj-chev{color:var(--ink-soft);font-weight:400;font-size:16px;}
  .obj-answer{
    max-height:0;
    overflow:hidden;
    transition:max-height .22s ease;
    font-size:14px;
    line-height:1.55;
    color:#fff;
    background:var(--accent-deep);
  }
  .obj-answer-inner{padding:10px 14px 14px;}
  .obj-answer.open{max-height:600px;}
  .obj-answer .placeholder{color:#bfe3d6;font-style:italic;}
  header{margin-bottom:24px;}
  .eyebrow{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent-deep);
    font-weight:700;
    margin-bottom:6px;
  }
  h1{
    font-size:26px;
    margin:0 0 4px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--ink-soft);font-size:14px;margin:0;}

  .trail{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:20px 0 24px;
  }
  .chip{
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-size:12.5px;
    padding:6px 12px;
    border-radius:100px;
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent-deep);}
  .chip.current{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
    cursor:default;
  }
  .chip .arrow{opacity:.4;font-size:11px;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px 28px 26px;
    box-shadow:0 1px 2px rgba(21,32,33,0.04);
    transition:opacity .28s ease, transform .28s ease;
  }

  .tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:6px;
    margin-bottom:14px;
  }
  .tag.say{background:var(--accent-soft);color:var(--accent-deep);}
  .tag.ask{background:var(--amber-soft);color:var(--amber);}
  .tag.done{background:#eef0f2;color:#3d474a;}

  .script-line{
    font-size:18px;
    line-height:1.55;
    color:var(--ink);
    margin:0 0 14px;
  }
  .script-line:last-of-type{margin-bottom:0;}
  .script-line .qmark{color:var(--ink-soft);}

  .prompt{
    font-size:13px;
    color:var(--ink-soft);
    margin:22px 0 12px;
    font-weight:600;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt-btn{
    text-align:left;
    background:var(--paper);
    border:1.5px solid var(--line);
